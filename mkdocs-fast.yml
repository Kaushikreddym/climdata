site_name: climdata
site_description: This project automates the fetching, extraction and processing of weather data from multiple sources — such as MSWX, DWD HYRAS, ERA5-Land, NASA-NEX-GDDP, and more — for a given location and time range.
site_author: Kaushikreddym
site_url: https://Kaushikreddym.github.io/climdata
repo_url: https://github.com/Kaushikreddym/climdata

copyright: "Copyright &copy; 2024 - 2024 Kaushik Muduchuru"

theme:
    palette:
        - scheme: default
          primary: light green
        #   toggle:
        #       icon: material/toggle-switch-off-outline
        #       name: Switch to dark mode
        # - scheme: slate
        #   primary: light green
        #   accent: indigo
        #   toggle:
        #       icon: material/toggle-switch
        #       name: Switch to light mode
    name: material
    logo: assets/climdata_logo.png
    icon:
        repo: fontawesome/brands/github
    custom_dir: "docs/overrides"
    font:
        text: Google Sans
        code: Regular
    features:
        - navigation.instant
        - navigation.tracking
        - navigation.top
        - search.highlight
        - search.share
    extra_css:
    - overrides/assets.css

plugins:
    - search
    - mkdocstrings:
        handlers:
            python:
                docstring_style: google
                options:
                    show_root_heading: true

markdown_extensions:
    - admonition
    - abbr
    - attr_list
    - def_list
    - footnotes
    - meta
    - md_in_html
    - tables
    - pymdownx.details
    - pymdownx.superfences
    - pymdownx.tabbed:
          alternate_style: true
    - pymdownx.highlight:
          linenums: true
    - toc:
          permalink: true

nav:
    - Home: index.md
    - Installation: installation.md
    - Usage: usage.md
    - Datasets:
        - Overview: datasets.md
        - MSWX Guide: MSWX_guide.md
        - DWD Export Format: dwd_format_guide.md
    - Bias Correction: bcsd_guide.md
    - Reference:
        - API: api.md
        - Concepts: common.md
        - FAQ: faq.md
    - Contributing: contributing.md
    - Changelog: changelog.md
    - Report Issues: https://github.com/Kaushikreddym/climdata/issues
