defaults:
  - _self_
  - mappings/parameters@dsinfo
  - mappings/variables@varinfo 
  - mappings/indices@extinfo
  - mappings/actions@actionsinfo
  - mappings/imputation@imputeinfo
  - regions/regions.yaml@bounds

dataset: MSWX
lat: null
lon: null
aoi: null
shapefile: null

variables: ["tasmin","tasmax","pr","tas","rsds","hurs","sfcWind","rlds","huss","ps","evpot","soilMoist","soilTemp"]
data_dir: ./data

region: null

box:
  lat_min: null
  lat_max: null
  lon_min: null
  lon_max: null

time_range:
  start_date: "1989-01-01"
  end_date: "2020-12-31"

index: null
impute: null

# Target grid for climdata.reproject().
# The units of target_resolution must match the axis units of target_projection:
#   projected CRS  (EPSG:3035, EPSG:32632, ...) -> linear,  e.g. "10 km", "1000 m"
#   geographic CRS (EPSG:4326, EPSG:4258, ...)  -> angular, e.g. "0.1 deg", "30 arcsec"
# Mixing them (e.g. "10 km" with EPSG:4326) raises ResolutionCRSMismatch.
target_projection: null
target_resolution: null

regrid:
  method: bilinear     # nearest | bilinear | cubic | average | mode | sum | ...
  align: true          # snap the grid origin to whole multiples of the resolution
  bounds: null         # [left, bottom, right, top] in target_projection units
  engine: rasterio     # rasterio | xesmf (xesmf = area-weighted conservative)

experiment_id: historical
source_id: MIROC6
table_id: day


output:
  out_dir: '.'
  filename_csv: "{provider}_{parameter}_LAT{lat_or_lat_range}_LON{lon_or_lon_range}_{start}_{end}.csv"
  filename_zarr: "{provider}_{parameter}_LAT{lat_or_lat_range}_LON{lon_or_lon_range}_{start}_{end}.zarr"
  filename_nc: "{provider}_{parameter}_LAT{lat_or_lat_range}_LON{lon_or_lon_range}_{start}_{end}.nc"
  fmt: "standard"
