extract:
  type: primary
  output: dataset
  description: "Downloads climate data to DATA_DIR if required, fetches the files and converts to xarray Dataset"
  
calc_index:
  type: primary
  output: dataset
  description: "Compute extreme index from Dataset"

impute:
  type: primary
  output: dataset
  description: "Impute missing values in the dataset"

reproject:
  type: primary
  output: dataset
  description: "Reproject and/or resample the dataset onto a target CRS and resolution (rasterio/rioxarray)"

to_nc:
  type: secondary
  output: filename
  description: "Save xarray dataset to NetCDF"

to_csv:
  type: secondary
  output: filename
  description: "Save current long-form DataFrame to CSV file"

upload_netcdf:
  type: secondary
  output: dataset
  description: "Upload a NetCDF file and store it as xarray Dataset"

upload_csv:
  type: secondary
  output: dataset
  description: "Upload a CSV file and convert it to xarray Dataset"